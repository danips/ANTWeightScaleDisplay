name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
      - name: Unit tests, lint, release artifacts, and test APK
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease bundleRelease assembleDebugAndroidTest

  connected-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
      - name: Provision managed-device system images
        run: |
          sdkmanager --install \
            "system-images;android-27;default;x86" \
            "system-images;android-35;default;x86_64"
          test -d "$ANDROID_HOME/system-images/android-27/default/x86"
          test -d "$ANDROID_HOME/system-images/android-35/default/x86_64"
      - name: Android smoke tests on API 27 and 35
        run: >-
          ./gradlew pixel2Api27DebugAndroidTest pixel2Api35DebugAndroidTest
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
          -Pandroid.experimental.testOptions.managedDevices.maxConcurrentDevices=1
