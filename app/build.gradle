plugins {
    id 'com.android.application'
}

def localeDirectoryPattern =
        ~/^values-([a-z]{2}(?:-r[A-Z]{2})?|b\+[A-Za-z0-9+]+)$/
def translatedLocales = fileTree('src/main/res') {
    include 'values-*/strings.xml'
}.files.collect { stringsFile ->
    def matcher = stringsFile.parentFile.name =~ localeDirectoryPattern
    matcher.matches() ? matcher.group(1) : null
}.findAll().toSet()
def supportedLocales = (['en'] + translatedLocales).sort()

android {
    namespace = 'com.quantrity.antscaledisplay'
    compileSdk 37

    defaultConfig {
        applicationId "com.quantrity.antscaledisplay"
        minSdk 23
        targetSdk 37
        versionCode 327
        versionName "3.27"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    androidResources {
        // Default resources are English; translated locales come from values-*/strings.xml.
        localeFilters += supportedLocales
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        viewBinding = true
        aidl = true
    }
    testOptions {
        managedDevices {
            localDevices {
                pixel2Api27 {
                    device = "Pixel 2"
                    apiLevel = 27
                    systemImageSource = "aosp"
                    testedAbi = "x86"
                }
                pixel2Api35 {
                    device = "Pixel 2"
                    apiLevel = 35
                    systemImageSource = "aosp"
                    testedAbi = "x86_64"
                }
            }
        }
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20260719'
    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'

    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
    implementation 'com.google.android.gms:play-services-basement:18.10.0'
    testImplementation 'com.garmin:fit:21.212.0'

}
